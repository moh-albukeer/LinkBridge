name: Build LinkBridge v1.0.0 Ready-to-Run EXE and APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt

      - name: Run Automated Protocol & Integration Verification Tests
        run: |
          python -u tests/test_linkbridge_suite.py

      - name: Build single-file standalone LinkBridge-Windows.exe (v1.0.0, Signed, No UPX)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --noupx `
            --version-file "windows/version_info.txt" `
            --name "LinkBridge-Windows" `
            --paths "." windows/app.py

          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Mohammed Albukeer (LinkBridge v1.0.0)" -CertStoreLocation "Cert:\CurrentUser\My" -HashAlgorithm SHA256
          Set-AuthenticodeSignature -FilePath "dist\LinkBridge-Windows.exe" -Certificate $cert -HashAlgorithm SHA256 | Out-Null

      - name: Upload LinkBridge-Windows.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkBridge-Windows-EXE
          path: dist/LinkBridge-Windows.exe
          if-no-files-found: error

  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Write Android SDK Licenses & Ensure Platform 34 Installed
        shell: bash
        run: |
          set +e +o pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV

          mkdir -p "$SDK_DIR/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$SDK_DIR/licenses/android-googletv-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$SDK_DIR/licenses/google-gdk-license"
          printf "\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d\n" > "$SDK_DIR/licenses/mips-android-sysimage-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a\n" > "$SDK_DIR/licenses/intel-android-extra-license"

          SDKMGR=$(find "$SDK_DIR" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMGR" --sdk_root="$SDK_DIR" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          exit 0

      - name: Install Gradle 8.5 (Compatible with AGP 8.2.2 & Kotlin 1.9.22)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle-8.5.zip
          unzip -q -o /tmp/gradle-8.5.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build Android 9+ APK
        working-directory: ./android
        run: |
          /tmp/gradle/gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LinkBridge-Android.apk

      - name: Upload LinkBridge-Android.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkBridge-Android-APK
          path: android/app/build/outputs/apk/debug/LinkBridge-Android.apk
          if-no-files-found: error

  publish-github-release:
    name: Publish EXE & APK to GitHub Releases (v1.0.0)
    needs: [ build-windows-exe, build-android-apk ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Built Windows EXE & Android APK
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare Direct Release Assets
        shell: bash
        run: |
          mkdir -p release-files
          find release-assets -name "LinkBridge-Windows.exe" -exec cp {} release-files/LinkBridge-Windows.exe \;
          find release-assets -name "LinkBridge-Android.apk" -exec cp {} release-files/LinkBridge-Android.apk \;
          ls -lh release-files/
          test -f release-files/LinkBridge-Windows.exe
          test -f release-files/LinkBridge-Android.apk

      - name: Create or Update GitHub Release v1.0.0 via GitHub REST API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - << 'EOF'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          tag = "v1.0.0"
          title = "LinkBridge v1.0.0 — Ready-to-Run Windows EXE & Android APK"
          notes = (
              "### 🌉 LinkBridge v1.0.0 — First Official Release\n"
              "**Developed by:** Mohammed Albukeer (mohammedalbukeer@gmail.com)\n\n"
              "#### 📥 Direct Downloads (التحميل المباشر):\n"
              "- 💻 **Windows 10 / 11 (64-bit):** Download **`LinkBridge-Windows.exe`** below and run directly (standalone, zero dependencies).\n"
              "- 📱 **Android 9.0+ (API 28–34+):** Download **`LinkBridge-Android.apk`** below and install directly on your phone.\n"
          )

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "LinkBridge-Release-Publisher",
          }

          def api_req(method, url, data=None, content_type="application/json"):
              req_headers = dict(headers)
              body = None
              if data is not None:
                  if isinstance(data, (bytes, bytearray)):
                      body = data
                  else:
                      body = json.dumps(data).encode("utf-8")
                  req_headers["Content-Type"] = content_type
              req = urllib.request.Request(url, data=body, headers=req_headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read().decode("utf-8")
                      return resp.status, (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode("utf-8", errors="replace")
                  return e.code, {"error": err_body}

          base_url = f"https://api.github.com/repos/{repo}"

          # 1. Check if release for tag v1.0.0 already exists
          status, rel = api_req("GET", f"{base_url}/releases/tags/{tag}")
          if status == 200 and "id" in rel:
              release_id = rel["id"]
              print(f"Found existing release {tag} (id={release_id}), updating metadata...")
              status, rel = api_req(
                  "PATCH",
                  f"{base_url}/releases/{release_id}",
                  {
                      "tag_name": tag,
                      "target_commitish": sha,
                      "name": title,
                      "body": notes,
                      "draft": False,
                      "prerelease": False,
                  },
              )
          else:
              print(f"Creating new GitHub Release {tag}...")
              status, rel = api_req(
                  "POST",
                  f"{base_url}/releases",
                  {
                      "tag_name": tag,
                      "target_commitish": sha,
                      "name": title,
                      "body": notes,
                      "draft": False,
                      "prerelease": False,
                  },
              )

          if status not in (200, 201) or "id" not in rel:
              print(f"::error::Failed to create or update GitHub Release (HTTP {status}): {rel}")
              if status == 403:
                  print(
                      "::error::GitHub token lacks write permission! Go to Repository Settings -> Actions -> General -> Workflow permissions, and select 'Read and write permissions'."
                  )
              sys.exit(1)

          release_id = rel["id"]
          existing_assets = rel.get("assets", [])

          # 2. Delete existing assets with the same names so we can overwrite cleanly
          assets_to_upload = [
              ("LinkBridge-Windows.exe", "release-files/LinkBridge-Windows.exe", "application/vnd.microsoft.portable-executable"),
              ("LinkBridge-Android.apk", "release-files/LinkBridge-Android.apk", "application/vnd.android.package-archive"),
          ]
          target_names = {a[0] for a in assets_to_upload}
          for asset in existing_assets:
              if asset.get("name") in target_names:
                  aid = asset["id"]
                  print(f"Removing previous asset {asset['name']} (id={aid})...")
                  api_req("DELETE", f"{base_url}/releases/assets/{aid}")

          # 3. Upload fresh EXE and APK assets directly to the release
          for name, filepath, ctype in assets_to_upload:
              with open(filepath, "rb") as f:
                  file_bytes = f.read()
              upload_url = f"https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name={name}"
              print(f"Uploading {name} ({len(file_bytes)} bytes)...")
              up_status, up_resp = api_req("POST", upload_url, data=file_bytes, content_type=ctype)
              if up_status not in (200, 201):
                  print(f"::error::Failed to upload asset {name} (HTTP {up_status}): {up_resp}")
                  sys.exit(1)
              print(f"Successfully uploaded {name}: {up_resp.get('browser_download_url')}")

          print("GitHub Release v1.0.0 published successfully!")
          EOF
